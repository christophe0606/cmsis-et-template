solution:
  description: Zephyr ExecuTorch template for Cortex-M with Ethos-U85.
# Usage:
#   cbuild setup zephyr-u85/zephyr-u85.csolution.yml --active Corstone-320-FVP --packs      # create *.cbuild-mlops.yml
#   python model_conversion/create_ai_layer.py zephyr-u85/zephyr-u85.cbuild-mlops.yml       # create ExecuTorch programs
#   cbuild zephyr-u85/zephyr-u85.csolution.yml --active Corstone-320-FVP                    # build application
#
# See MLOps information: https://open-cmsis-pack.github.io/cmsis-toolbox/build-overview/#mlops-integration

  packs:
    - pack: ARM::SSE_320_BSP@^2.0.0
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0
    # ExecuTorch is an external Zephyr module. The Ethos-U driver itself is
    # supplied by upstream Zephyr 4.5 and its hal_ethos_u module.
    - pack: PyTorch::ExecuTorch@1.6.0-zephyrpreview2

  target-types:
    - type: AppKit-E8
      board: AppKit-E8-AIML
      device: AE822FA0E5597BS0:M55_HP
      variables:
        - AI-Layer: $SolutionDir()$/ai_layer/ai_layer.clayer.yml
        - west-board: ensemble_e8_ak/ae822fa0e5597bs0/rtss_hp
      west-defs:
        - DTC_OVERLAY_FILE: app.overlay
        - EXTRA_CONF_FILE: app.conf
      target-set:
        - set:
          debugger:
            name: J-Link Server
            protocol: swd
            clock: 4000000
            start-pname: M55_HP
          images:
            - project-context: Zephyr_app.Debug

    - type: Corstone-320-FVP
      board: ARM::SSE-320
      device: ARM::SSE-320-FVP
      variables:
        - AI-Layer: $SolutionDir()$/ai_layer/ai_layer.clayer.yml
        - west-board: mps4/corstone320/fvp
      west-defs:
        - DTC_OVERLAY_FILE: fvp.overlay
        - FVP_SHUTDOWN_ON_EOT: ON
        # ExecuTorch tag.h uses size_t without including <stddef.h>.
        - CMAKE_CXX_FLAGS: -includestddef.h
      target-set:
        - set:
          debugger:
            name: Arm-FVP
            model: FVP_Corstone_SSE-320
            config-file: fvp_config.txt
            args: --simlimit 60
          images:
            - project-context: Zephyr_app.Debug

  build-types:
    - type: Debug
      debug: on
      optimize: debug
      west-defs:
        - CONFIG_DEBUG: y
        - CONFIG_DEBUG_THREAD_INFO: y
        - CONFIG_DEBUG_OPTIMIZATIONS: y

    - type: Release
      optimize: speed
      west-defs:
        - CONFIG_SPEED_OPTIMIZATIONS: y

  projects:
    - west:
        project-id: Zephyr_app
        app-path: .
        board: $west-board$
        west-defs:
          - EXTRA_ZEPHYR_MODULES: $Pack(PyTorch::ExecuTorch)$

  mlops:
    description: TinyCNN for an Ethos-U85-256 target
    npu:
      type: Ethos-U85
      macs: 256
    vela:
      system: RTSS_HP_SRAM_MRAM
      memory: Shared_Sram
    model:
      clayer: $AI-Layer$
      zephyr:
      input:
        # Alternative: comment the active input below and uncomment this entry.
        # Generate it with model/TinyCNN/quantize_multiple_models.py first.
         - name: TinyCNNMultiple
           file: ../model/TinyCNN/TinyCNNMultiple.pt2
        # Generate it with model/TinyCNN/quantize_model.py first.
        #- name: TinyCNN
        #  file: ../model/TinyCNN/TinyCNN.pt2
        #- name: TinyCNN
        #  file: ../model/TinyCNN/model.py
        #  parameters:
        #    input-shape: 1x16x16x3
        #    calibration-samples: 2

  compiler: GCC
  created-for: CMSIS-Toolbox@2.15.0

solution:
  description: CMSIS ExecuTorch template for Cortex-M with Ethos-U85.
# Usage:
#   cbuild setup cmsis-u85/cmsis-u85.csolution.yml --active SSE-320-U85 --packs      # create *.cbuild-mlops.yml
#   python model_conversion/create_ai_layer.py cmsis-u85/cmsis-u85.cbuild-mlops.yml  # create ExecuTorch programs
#   cbuild cmsis-u85/cmsis-u85.csolution.yml --active SSE-320-U85                    # build application
#
# See MLOps information: https://open-cmsis-pack.github.io/cmsis-toolbox/build-overview/#mlops-integration

  created-for: CMSIS-Toolbox@2.15.0
  cdefault:
  #compiler: GCC@14.3.1
  compiler: GCC

  output-dirs:
    # Keep GCC dependency-file paths below the Windows path-length limit.
    tmpdir: ../tmp/u85

  packs:
    # The PyTorch::ExecuTorch pack version must match the ExecuTorch Python
    # exporter in requirements.txt because its runtime consumes the generated .pte.
    - pack: PyTorch::ExecuTorch@1.6.0-zephyrpreview2
    - pack: ARM::Cortex_DFP

  target-types:
    # Corstone-320 with an Ethos-U85 NPU, simulated on the Arm FVP.
    - type: SSE-320-U85
      board: SSE-320
      device: SSE-320-FVP
      variables:
        - Board-Layer: $SolutionDir()$/board/Corstone-320/Board-U85.clayer.yml
        - AI-Layer: $SolutionDir()$/ai_layer/ai_layer.clayer.yml
      target-set:
        - set:
          images:
            - project-context: cmsis-u85.Debug
            # - project-context: cmsis-u85-multiple.Debug
          debugger:
            name: Arm-FVP
            # On macOS use .vscode/fvp.sh and copy launch.json.mac to launch.json.
            # See: https://github.com/Arm-Examples/FVPs-on-Mac/tree/main/skills/fvp-debug-setup
            model: FVP_Corstone_SSE-320
            config-file: board/Corstone-320/fvp_config.txt
            args: "--simlimit 60"

  build-types:
    - type: Debug
      debug: on
      optimize: none
      misc:
        - for-compiler: AC6
          C-CPP:
            - -O0

  projects:
    - project: ./cmsis-u85.cproject.yml
    # Multiple-model alternative: comment the project above and uncomment this.
    # Also use cmsis-u85-multiple.Debug in target-set.images.project-context.
    # - project: ./cmsis-u85-multiple.cproject.yml

  # Target and model settings consumed by create_ai_layer.py.
  mlops:
    description: TinyCNN int8 image classifier for Ethos-U85
    npu:
      type: Ethos-U85                # explicit: the SSE-320 device pack declares no NPU
    vela:
      system: Ethos_U85_SYS_DRAM_Mid # system-config from the Vela config
      memory: Shared_Sram            # memory-mode from the Vela config
    model:
      clayer: $AI-Layer$
      input:
        # Alternative: comment the active input below and uncomment this entry.
        # Generate it with model/TinyCNN/quantize_multiple_models.py first.
        # - name: TinyCNNMultiple
        #   file: ../model/TinyCNN/TinyCNNMultiple.pt2
        - name: TinyCNN
          file: ../model/TinyCNN/model.py
          # Model parameters: the NHWC input shape and number of samples used
          # for quantizer calibration.
          parameters:
            input-shape: 1x16x16x3
            calibration-samples: 2

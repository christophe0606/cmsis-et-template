name: Build and test Zephyr examples

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.example }} / ${{ matrix.target }} (GCC)
    runs-on: ubuntu-latest
    env:
      CMSIS_PACK_ROOT: /home/runner/.cache/arm/packs

    strategy:
      fail-fast: false
      matrix:
        include:
          - example: zephyr-m
            target: Corstone-300-FVP
            fvp: FVP_Corstone_SSE-300
          - example: zephyr-u55
            target: Corstone-300-FVP
            fvp: FVP_Corstone_SSE-300_Ethos-U55
          - example: zephyr-u85
            target: Corstone-320-FVP
            fvp: FVP_Corstone_SSE-320

    steps:
      - uses: actions/checkout@v7

      - name: Activate vcpkg environment
        uses: ARM-software/cmsis-actions/vcpkg@v1.3.1
        with:
          config: .github/vcpkg-zephyr.json
          cache: cmsis-executorch-zephyr

      - name: Add FVP license tools to PATH
        run: echo "$(dirname "${AVH_FVP_PLUGINS%/}")/arm_license_management_utilities" >> "${GITHUB_PATH}"

      # Temporary pin until the required CMSIS-Toolbox version is released.
      # Source: https://github.com/Open-CMSIS-Pack/cmsis-toolbox/actions/runs/42539739700
      - name: Install nightly CMSIS-Toolbox
        env:
          CMSIS_TOOLBOX_URL: https://nightly.link/Open-CMSIS-Pack/cmsis-toolbox/actions/runs/42539739700/cmsis-toolbox-linux-amd64.zip
          CMSIS_TOOLBOX_SHA256: 2d28b494bd25d76eff35c4a8903d73cabd835912c536e61dd5bbf38d3bef17b2
        run: |
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/cmsis-toolbox.zip" \
            "${CMSIS_TOOLBOX_URL}"
          echo "${CMSIS_TOOLBOX_SHA256}  ${RUNNER_TEMP}/cmsis-toolbox.zip" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/cmsis-toolbox"
          unzip -q "${RUNNER_TEMP}/cmsis-toolbox.zip" -d "${RUNNER_TEMP}/cmsis-toolbox"
          echo "${RUNNER_TEMP}/cmsis-toolbox/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/cmsis-toolbox/bin/cbuild" --version
          "${RUNNER_TEMP}/cmsis-toolbox/bin/cpackget" --version

      # Arm Virtual Hardware requires an Arm tools license for every compiler.
      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache CMSIS packs
        uses: actions/cache@v6
        with:
          key: cmsis-packs-zephyr-${{ hashFiles('zephyr-*/*.csolution.yml', 'Pack/*.pack') }}
          path: ${{ env.CMSIS_PACK_ROOT }}

      - name: Install repository packs
        run: |
          cpackget add --agree-embedded-license Pack/*.pack
          test -f "${CMSIS_PACK_ROOT}/PyTorch/ExecuTorch/1.6.0-zephyrpreview2/PyTorch.ExecuTorch.pdsc"

      - name: Cache Zephyr workspace
        uses: actions/cache@v6
        with:
          key: zephyr-4.5-executorch-modules-v2-${{ runner.os }}
          path: ../zephyr-workspace

      - name: Prepare Zephyr 4.5
        run: |
          python -m pip install west
          if [ ! -d ../zephyr-workspace/.west ]; then
            mkdir -p ../zephyr-workspace
            git clone --depth 1 --branch v4.5.0 \
              https://github.com/zephyrproject-rtos/zephyr \
              ../zephyr-workspace/zephyr
            west init -l ../zephyr-workspace/zephyr
          fi
          cd ../zephyr-workspace
          python -m pip install -r zephyr/scripts/requirements.txt
          west update --narrow -o=--depth=1 cmsis cmsis_6 cmsis-dsp cmsis-nn hal_ethos_u
          west zephyr-export

      # Build the committed, target-validated AI artifacts without regenerating
      # them in this workflow.
      - name: Check committed Zephyr AI layer
        run: |
          test -f "${{ matrix.example }}/ai_layer/TinyCNN.pte"
          test -f "${{ matrix.example }}/ai_layer/TinyCNN_pte.c"
          test -f "${{ matrix.example }}/ai_layer/TinyCNN_pte.h"
          test -f "${{ matrix.example }}/ai_layer/TinyCNN_REPORT.md"

      # Override local solution compiler selections for this GCC-only workflow.
      - name: Generate MLOps information
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/../zephyr-workspace/zephyr
        run: cbuild setup ${{ matrix.example }}/${{ matrix.example }}.csolution.yml --active ${{ matrix.target }} --packs --toolchain GCC

      - name: Build ${{ matrix.target }}
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/../zephyr-workspace/zephyr
        run: cbuild ${{ matrix.example }}/${{ matrix.example }}.csolution.yml --active ${{ matrix.target }} --packs --toolchain GCC

      - name: Run ${{ matrix.target }}
        working-directory: ${{ matrix.example }}
        run: |
          set -o pipefail
          ${{ matrix.fvp }} \
            -f fvp_config.txt \
            -a out/Zephyr_app/${{ matrix.target }}/Debug/zephyr/zephyr.elf \
            --simlimit 60 2>&1 | tee ../${{ matrix.example }}-fvp.log

      - name: Check application result
        run: 'grep -Fq "Test_result: PASS" "${{ matrix.example }}-fvp.log"'

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.example }}-${{ matrix.target }}-GCC
          path: |
            ${{ matrix.example }}/out
            ${{ matrix.example }}/ai_layer
            ${{ matrix.example }}-fvp.log
          if-no-files-found: warn

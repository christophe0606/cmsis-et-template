# Set y after selecting TinyCNNMultiple.pt2 in the csolution and regenerating ai_layer.
CONFIG_EXECUTORCH_MULTIPLE_TEST=n

# Use the CMSIS-NN module from the Zephyr workspace. The generated ExecuTorch
# operator configuration selects the individual CMSIS-NN source groups needed
# by the model.
CONFIG_CMSIS_NN=y

# C++ allocations must use a heap initialized by Zephyr.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Let Zephyr request frame-pointer omission even in unoptimized builds.
CONFIG_OVERRIDE_FRAME_POINTER_DEFAULT=y
CONFIG_OMIT_FRAME_POINTER=y

# Use the Cortex-M55 hardware FPU and pass floating-point arguments in FP
# registers.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Runtime loading uses C++ containers; the runner also prints float logits.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_REQUIRES_FLOAT_PRINTF=y

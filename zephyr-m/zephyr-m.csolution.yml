solution:
  description: Zephyr ExecuTorch template for Cortex-M CPU-only inference.
  # Usage:
  #   cbuild setup zephyr-m/zephyr-m.csolution.yml --active AppKit-E8 --packs      # create *.cbuild-mlops.yml
  #   python model_conversion/create_ai_layer.py zephyr-m/zephyr-m.cbuild-mlops.yml # create ExecuTorch programs
  #   cbuild zephyr-m/zephyr-m.csolution.yml --active AppKit-E8                    # build application
  #
  # Replace AppKit-E8 with Corstone-300-FVP to build and run on the FVP.

  packs:
    - pack: ARM::V2M_MPS3_SSE_300_BSP@^1.5.0
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0
    # ExecuTorch is an external Zephyr module. CMSIS-NN is supplied by the
    # Zephyr workspace and selected through Kconfig.
    - pack: PyTorch::ExecuTorch@1.6.0-zephyrpreview2

  target-types:
    - type: AppKit-E8
      board: AppKit-E8-AIML
      device: AE822FA0E5597BS0:M55_HP
      variables:
        - AI-Layer: $SolutionDir()$/ai_layer/ai_layer.clayer.yml
        - west-board: ensemble_e8_ak/ae822fa0e5597bs0/rtss_hp
      west-defs:
        - EXTRA_CONF_FILE: app.conf
      target-set:
        - set:
          debugger:
            name: J-Link Server
            protocol: swd
            clock: 4000000
            start-pname: M55_HP
          images:
            - project-context: Zephyr_app.Debug

    - type: Corstone-300-FVP
      board: ARM::V2M-MPS3-SSE-300-FVP
      device: ARM::SSE-300-MPS3
      variables:
        - AI-Layer: $SolutionDir()$/ai_layer/ai_layer.clayer.yml
        - west-board: mps3/corstone300/fvp
      west-defs:
        - FVP_SHUTDOWN_ON_EOT: ON
        # ExecuTorch tag.h uses size_t without including <stddef.h>.
        - CMAKE_CXX_FLAGS: -includestddef.h
      target-set:
        - set:
          debugger:
            name: Arm-FVP
            model: FVP_Corstone_SSE-300_Ethos-U55
            config-file: fvp_config.txt
            args: --simlimit 60
          images:
            - project-context: Zephyr_app.Debug

  build-types:
    - type: Debug
      debug: on
      optimize: debug
      west-defs:
        - CONFIG_DEBUG: y
        - CONFIG_DEBUG_THREAD_INFO: y
        - CONFIG_DEBUG_OPTIMIZATIONS: y

    - type: Release
      optimize: speed
      west-defs:
        - CONFIG_SPEED_OPTIMIZATIONS: y

  projects:
    - west:
        project-id: Zephyr_app
        app-path: .
        board: $west-board$
        west-defs:
          - EXTRA_ZEPHYR_MODULES: $Pack(PyTorch::ExecuTorch)$

  # model.cpu selects the Cortex-M backend even when the device pack adds NPU
  # information for the M55_HP target to the generated MLOps file.
  mlops:
    description: TinyCNN int8 image classifier for Cortex-M55
    model:
      clayer: $AI-Layer$
      zephyr:
      input:
        # Alternative: comment the active input below and uncomment this entry.
        # Generate it with model/TinyCNN/quantize_multiple_models.py first.
        # - name: TinyCNNMultiple
        #   file: ../model/TinyCNN/TinyCNNMultiple.pt2
        - name: TinyCNN
          file: ../model/TinyCNN/model.py
          cpu:
          parameters:
            input-shape: 1x16x16x3
            calibration-samples: 2

  compiler: GCC
  created-for: CMSIS-Toolbox@2.15.0

solution:
  description: CMSIS ExecuTorch template for Cortex-M CPU-only inference.
# Usage:
#   cbuild setup cmsis-m/cmsis-m.csolution.yml --active SSE-300-M55 --packs      # create *.cbuild-mlops.yml
#   python model_conversion/create_ai_layer.py cmsis-m/cmsis-m.cbuild-mlops.yml # create ExecuTorch programs
#   cbuild cmsis-m/cmsis-m.csolution.yml --active SSE-300-M55                   # build application

  created-for: CMSIS-Toolbox@2.15.0
  cdefault:
  compiler: GCC

  output-dirs:
    # Keep GCC dependency-file paths below the Windows path-length limit.
    tmpdir: ../tmp/m

  packs:
    - pack: PyTorch::ExecuTorch@1.6.0-zephyrpreview2
    - pack: ARM::Cortex_DFP

  target-types:
    - type: SSE-300-M55
      board: V2M-MPS3-SSE-300-FVP
      device: SSE-300-MPS3
      variables:
        - Board-Layer: $SolutionDir()$/board/Corstone-300/Board.clayer.yml
        - AI-Layer: $SolutionDir()$/ai_layer/ai_layer.clayer.yml
      target-set:
        - set:
          images:
            - project-context: cmsis-m.Debug
            # - project-context: cmsis-m-multiple.Debug
          debugger:
            name: Arm-FVP
            model: FVP_Corstone_SSE-300
            config-file: board/Corstone-300/fvp_config.txt
            args: "--simlimit 60"

  build-types:
    - type: Debug
      debug: on
      optimize: none
      misc:
        - for-compiler: AC6
          C-CPP:
            - -O0

  projects:
    - project: ./cmsis-m.cproject.yml
    # Multiple-model alternative: comment the project above and uncomment this.
    # Also use cmsis-m-multiple.Debug in target-set.images.project-context.
    # - project: ./cmsis-m-multiple.cproject.yml

  # No npu: node: create_ai_layer.py selects the Cortex-M backend from the
  # processor information generated for this target.
  mlops:
    description: TinyCNN int8 image classifier for Cortex-M55
    model:
      clayer: $AI-Layer$
      input:
        # Alternative: comment the active input below and uncomment this entry.
        # Generate it with model/TinyCNN/quantize_multiple_models.py first.
        # - name: TinyCNNMultiple
        #   file: ../model/TinyCNN/TinyCNNMultiple.pt2
        - name: TinyCNN
          file: ../model/TinyCNN/model.py
          parameters:
            input-shape: 1x16x16x3
            calibration-samples: 2

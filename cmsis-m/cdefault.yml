default:
  misc:
    - C-CPP:
        # Free a register for CMSIS-NN MVE inline assembly even at -O0.
        - -fomit-frame-pointer
    - C:
        - -std=c17
        - -Wall
        - -Wformat
        - -Wformat-security
        - -Wdouble-promotion
        - -Wpointer-arith
        - -Werror=implicit-int
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
    - for-compiler: AC6
      C-CPP:
        - -ffp-mode=full
    - for-compiler: GCC
      C-CPP:
        - -Wno-psabi

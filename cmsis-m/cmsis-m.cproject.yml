project:
  packs:
    - pack: ARM::CMSIS

  misc:
    - for-compiler: GCC
      Link:
        - -Wl,-u,_printf_float

  groups:
    - group: App
      files:
        - file: ./src/app_main.cpp
        - file: ./src/arm_embedded_module.cpp
        - file: ./src/arm_embedded_module.hpp

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI

  output:
    type:
      - elf
      - hex
      - map

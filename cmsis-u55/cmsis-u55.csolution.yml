solution:
  description: CMSIS ExecuTorch template for Cortex-M with Ethos-U55/U65.
# Usage:
#   cbuild setup cmsis-u55/cmsis-u55.csolution.yml --active SSE-300-U55 --packs      # create *.cbuild-mlops.yml
#   python model_conversion/create_ai_layer.py cmsis-u55/cmsis-u55.cbuild-mlops.yml  # create ExecuTorch programs
#   cbuild cmsis-u55/cmsis-u55.csolution.yml --active SSE-300-U55                    # build application
#
# See MLOps information: https://open-cmsis-pack.github.io/cmsis-toolbox/build-overview/#mlops-integration

  created-for: CMSIS-Toolbox@2.15.0
  cdefault:
  compiler: AC6

  output-dirs:
    # Keep GCC dependency-file paths below the Windows path-length limit.
    tmpdir: ../tmp/u55

  packs:
    # The PyTorch::ExecuTorch pack version must match the ExecuTorch Python
    # exporter in requirements.txt because its runtime consumes the generated .pte.
    - pack: PyTorch::ExecuTorch@1.6.0-zephyrpreview2
    - pack: ARM::Cortex_DFP

  target-types:
    # Corstone-300 with an Ethos-U55-128 NPU, simulated on the Arm FVP.
    - type: SSE-300-U55
      board: V2M-MPS3-SSE-300-FVP
      device: SSE-300-MPS3
      variables:
        - Board-Layer: $SolutionDir()$/board/Corstone-300/Board-U55.clayer.yml
        - AI-Layer: $SolutionDir()$/ai_layer/ai_layer.clayer.yml
      target-set:
        - set:
          images:
            - project-context: cmsis-u55.Debug
            # - project-context: cmsis-u55-multiple.Debug
          debugger:
            name: Arm-FVP
            # See: https://github.com/Arm-Examples/FVPs-on-Mac/tree/main/skills/fvp-debug-setup
            # On macOS use .vscode/fvp.sh and copy launch.json.mac to launch.json.
            model: FVP_Corstone_SSE-300_Ethos-U55
            config-file: board/Corstone-300/fvp_config_u55.txt
            args: "--simlimit 60"

  build-types:
    - type: Debug
      debug: on
      optimize: none
      misc:
        - for-compiler: AC6
          C-CPP:
            - -O0

  projects:
    - project: ./cmsis-u55.cproject.yml
    # Multiple-model alternative: comment the project above and uncomment this.
    # Also use cmsis-u55-multiple.Debug in target-set.images.project-context.
    # - project: ./cmsis-u55-multiple.cproject.yml

  # Target and model settings consumed by create_ai_layer.py.
  mlops:
    description: TinyCNN int8 image classifier for Ethos-U55-128
    npu:
      type: Ethos-U55
      macs: 128
    vela:
      system: Ethos_U55_High_End_Embedded
      memory: Shared_Sram
    model:
      clayer: $AI-Layer$
      input:
        # Alternative: comment the active input below and uncomment this entry.
        # Generate it with model/TinyCNN/quantize_multiple_models.py first.
        # - name: TinyCNNMultiple
        #   file: ../model/TinyCNN/TinyCNNMultiple.pt2
        - name: TinyCNN
          file: ../model/TinyCNN/model.py
          parameters:
            input-shape: 1x16x16x3
            calibration-samples: 2
